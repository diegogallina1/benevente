# A decisão anual de carteira, no primeiro pregão do ano.
#
# A amostra confirmatória da política declarada começa no primeiro pregão de
# 2027. Até lá tudo que o projeto publica sobre um ano é reconstrução, e a
# reconstrução é defensável porque a política é declarada. A partir de 2027 não
# é mais: a decisão precisa ser tomada NA data, com os dados disponíveis NA
# data. Se ela for produzida depois, com dados de depois, a amostra nasce
# contaminada e a afirmação central do trabalho morre junto.
#
# Duas escolhas de projeto que este arquivo carrega, e que valem ser lidas antes
# de mexer nele:
#
# 1. Ele não publica. Ele abre um pull request. A política exige aprovação
#    humana nomeada, e o robô não é ninguém: o que ele faz é preparar a decisão,
#    com a captura dos insumos e os livros, para alguém assinar. Aprovar é
#    mesclar, e o merge fica no histórico com o nome de quem aprovou.
#
# 2. Ele erra para o lado de não fazer nada. O modo de falha caro não é deixar
#    de decidir num dia — é decidir no dia errado, com insumo velho, e publicar
#    uma carteira que parece certa. Por isso o portão vem antes de qualquer
#    coisa que escreva, e por isso feriado não está codificado aqui: quem
#    responde se houve pregão é o dado, e a captura recusa retrato de outra data.

name: Decisão anual

on:
  workflow_dispatch:
    inputs:
      forcar:
        description: "Ignora janela e dia da semana (não ignora ano já decidido)"
        type: boolean
        default: false
  schedule:
    # Dias úteis de 1 a 15 de janeiro, às 9h. A janela é larga de propósito: se
    # o primeiro pregão escorregar por feriado, os dias seguintes tentam de novo.
    - cron: "0 9 1-15 1 1-5"
      timezone: "America/Sao_Paulo"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benevente-decisao-anual
  cancel-in-progress: false

jobs:
  decidir:
    name: Preparar a decisão do ano
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        # Presa ao SHA, nao a tag: uma tag e um ponteiro que o dono da action
        # pode mover, e este job roda com contents:write.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-ci.txt

      # Antes de qualquer coisa que escreva. Sai "agir", "pular" ou "recusar";
      # recusar é falha, e é assim que se descobre que janeiro passou sem
      # decisão em vez de o silêncio parecer sucesso.
      - name: Portão
        id: portao
        env:
          FORCAR: ${{ inputs.forcar }}
        run: |
          extra=""
          if [ "$FORCAR" = "true" ]; then extra="--forcar"; fi
          python tools/portao_da_decisao_anual.py $extra --github-output "$GITHUB_OUTPUT"

      # Os três passos abaixo tocam a rede: B3 para o retrato do universo e CVM
      # para os formulários. Qualquer um deles falhando derruba o job, e é o que
      # tem de acontecer: decidir sem o universo do dia ou sem os fundamentos
      # recebidos até a véspera seria decidir sobre outra coisa.
      - name: Retrato do universo B3 na data
        if: steps.portao.outputs.acao == 'agir'
        run: python build_b3_universe_snapshot.py

      - name: Formulários recebidos até a véspera
        if: steps.portao.outputs.acao == 'agir'
        run: python refresh_recent_itr.py

      - name: Congelar os insumos com hash
        if: steps.portao.outputs.acao == 'agir'
        run: |
          python tools/capturar_insumos.py --decisao "$(date +%Y-%m-%d)"

      - name: Decidir a partir da captura
        if: steps.portao.outputs.acao == 'agir'
        env:
          ANO: ${{ steps.portao.outputs.ano }}
        run: |
          python build_profile_books_2026.py \
            --insumos "artifacts/insumos_${ANO}" \
            --output "artifacts/profile_books_${ANO}"

      # A captura só vale como prova se continuar batendo depois de escrita, e o
      # ensaio garante que o maquinário que produziu esta decisão é o mesmo que
      # ainda reproduz a de 2026.
      - name: Conferir a captura e o maquinário
        if: steps.portao.outputs.acao == 'agir'
        env:
          ANO: ${{ steps.portao.outputs.ano }}
        run: |
          python tools/capturar_insumos.py --conferir "artifacts/insumos_${ANO}"
          python -m pytest tests/test_ensaio_decisao_anual.py tests/test_captura_de_insumos.py -q

      # Abre pull request, não publica. Quem aprova é uma pessoa, e o merge é o
      # registro dessa aprovação.
      - name: Abrir a decisão para aprovação
        if: steps.portao.outputs.acao == 'agir'
        env:
          GH_TOKEN: ${{ github.token }}
          ANO: ${{ steps.portao.outputs.ano }}
        run: |
          ramo="decisao/${ANO}"
          git config user.name "diegogallina1"
          git config user.email "214411949+diegogallina1@users.noreply.github.com"
          git checkout -b "$ramo"
          git add "artifacts/insumos_${ANO}" "artifacts/profile_books_${ANO}"
          git commit -m "Decisão de janeiro de ${ANO}, para aprovação"
          git push origin "$ramo"
          gh pr create --base main --head "$ramo" \
            --title "Decisão de janeiro de ${ANO}" \
            --body-file .github/decisao-anual-corpo.md
