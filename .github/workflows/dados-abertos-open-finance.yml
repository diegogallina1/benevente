# Roda o coletor de dados abertos do Open Finance num runner, e não numa máquina.
#
# Existe porque o obstáculo nunca foi o código: era alcance de rede. Os dados
# abertos ficam no host de cada participante, todos no Brasil, e quem desenvolve
# nem sempre tem de onde chamá-los. O runner da Actions tem, e é gratuito para
# este uso.
#
# Não há credencial aqui, e isso não é descuido: a especificação de dados
# abertos não tem esquema de segurança, e o coletor não envia cabeçalho de
# autorização. Um teste prende isso. Por isso o job pede só leitura: ele não
# escreve no repositório, não publica nada e não tem segredo no ambiente.
name: Dados abertos do Open Finance

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "listar (quem publica), colher (busca os dados) ou diagnostico (TLS)"
        type: choice
        options: [listar, colher, diagnostico]
        default: listar
      limite:
        # Era "Vazio = todos", e vazio nunca quis dizer todos: o GitHub repõe o
        # default quando o valor chega em branco, entao pedir a colheita inteira
        # devolvia os mesmos cinco em silencio. Um valor explicito diz o que o
        # vazio nao consegue, e o default continua pequeno para um clique
        # distraido nao percorrer quarenta e seis hosts de terceiros.
        description: "Quantos participantes percorrer no modo colher. 0 = todos"
        type: string
        default: "5"
      participante:
        description: "Filtra por trecho do nome da organização ou da marca"
        type: string
        default: ""
      ca_extra_url:
        # Vazia de propósito, e não por falta de candidata. O diagnóstico de
        # 17/09/2026 mostrou que a raiz que falta é a da ICP-Brasil, mas a URL
        # oficial dela não foi conferida de dentro deste ambiente, e este
        # projeto não adivinha URL — é a mesma regra de data/b3_endpoints.json.
        # Quem preencher, preenche com o endereço lido na fonte oficial, e a
        # execução imprime o sha256 e o titular do que baixou, para conferir
        # antes de confiar e para fixar depois.
        description: "URL do PEM com âncora adicional. Vazio = só as do sistema"
        type: string
        default: ""

# Só leitura. Este workflow observa; quem publica é outro.
permissions:
  contents: read

concurrency:
  group: benevente-dados-abertos
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    # Colher percorre centenas de hosts de terceiros, com pausa entre chamadas
    # de propósito. O teto é alto porque o modo colher sem limite é lento por
    # escolha, não por defeito.
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        # Presa ao SHA, nao a tag, como nos outros workflows: uma tag e um
        # ponteiro que o dono da action pode mover.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # Sem passo de instalação: o coletor é biblioteca padrão inteira. Se um
      # dia deixar de ser, a lista é requirements-ci.txt, nunca uma escrita aqui
      # — foi assim que o radar caiu oito execuções seguidas em setembro.

      # Os três chegam por env, nunca por ${{ }} dentro do run. A interpolação
      # é substituição textual antes de o shell ler a linha, então um nome de
      # participante com aspas e ponto-e-vírgula viraria comando. Por env eles
      # chegam como valor de variável, que o shell trata como dado. Um teste
      # deste repositório reprova a outra forma, e reprovou a primeira versão
      # deste arquivo.
      # Baixar uma âncora de confiança é diferente de baixar um dado, e por
      # isso o passo imprime o sha256 e o titular antes de qualquer uso: quem
      # aperta o botão tem de poder conferir o que passou a ser confiado. A URL
      # precisa ser https — buscar âncora por texto claro seria pedir para
      # alguém no caminho escolher em quem o coletor confia.
      - name: Baixar a âncora adicional, se houver
        if: inputs.modo == 'colher'
        shell: bash
        env:
          CA_URL: ${{ inputs.ca_extra_url }}
        run: |
          if [ -z "$CA_URL" ]; then
            echo "Sem âncora adicional: valem só as do sistema."
            exit 0
          fi
          case "$CA_URL" in
            https://*) ;;
            *) echo "A URL da âncora precisa ser https."; exit 1 ;;
          esac
          curl -fsS --max-time 60 -o ca-extra.pem "$CA_URL"
          echo "sha256: $(sha256sum ca-extra.pem | cut -d" " -f1)"
          openssl x509 -in ca-extra.pem -noout -subject -issuer -enddate

      - name: Rodar o coletor
        if: inputs.modo != 'diagnostico'
        shell: bash
        env:
          MODO: ${{ inputs.modo }}
          LIMITE: ${{ inputs.limite }}
          PARTICIPANTE: ${{ inputs.participante }}
        run: |
          set -o pipefail
          argumentos=()
          if [ -n "$PARTICIPANTE" ]; then
            argumentos+=(--participante "$PARTICIPANTE")
          fi
          if [ "$MODO" = "listar" ]; then
            argumentos+=(--listar)
          elif [ -n "$LIMITE" ] && [ "$LIMITE" != "0" ]; then
            argumentos+=(--limite "$LIMITE")
          fi
          if [ -s ca-extra.pem ]; then
            argumentos+=(--ca-extra ca-extra.pem)
          fi
          python tools/build_open_finance_investments.py "${argumentos[@]}" | tee saida.txt

      # Quarenta das sessenta e três falhas da primeira colheita inteira foram
      # certificado que o bundle padrão não valida. O número não decide nada
      # sozinho: se a raiz for a PKI do próprio Open Finance, acrescentá-la ao
      # truststore é o conserto; se for certificado avulso por instituição, não
      # há o que fazer do nosso lado. Este passo lê o emissor e responde qual é.
      #
      # A primeira versão descartava o stderr e chamava de "sem resposta" tudo
      # que não casasse com um grep. Cinco dos oito hosts caíram nesse balde, e
      # o balde era do instrumento, não dos servidores: o coletor levanta
      # CERTIFICATE_VERIFY_FAILED nos oito, então os oito responderam. O que
      # faltava era ler o motivo, que estava no stderr jogado fora.
      #
      # Agora o stderr entra na captura e a linha lida é "Verification error:",
      # que o openssl imprime logo depois do handshake e sobrevive quando o
      # bloco SSL-Session não chega a ser impresso. Quando nem essa linha
      # aparece, sai o código de saída do openssl em vez de um rótulo inventado.
      #
      # Também conta quantos certificados o servidor mandou e lista todos os
      # emissores, não só o último. Cadeia curta terminando em raiz pública é o
      # retrato de intermediária faltando — a explicação que sobra quando a raiz
      # é confiável e a verificação falha mesmo assim, que é o caso de dois
      # destes hosts.
      #
      # Ele NÃO busca dado nenhum: abre a conexão, lê a cadeia e fecha. E o
      # coletor só imprime host que tem forma de host, porque esta lista vem do
      # diretório, que é preenchido por terceiros, e entra num laço de shell.
      - name: Diagnosticar o TLS dos hosts
        if: inputs.modo == 'diagnostico'
        shell: bash
        run: |
          python tools/build_open_finance_investments.py --hosts > hosts.txt
          : > saida.txt
          ruins=0
          total=0
          while read -r host; do
            [ -n "$host" ] || continue
            total=$((total + 1))
            bruto=$(echo | timeout 20 openssl s_client -connect "$host:443" \
                      -servername "$host" -showcerts 2>&1) && saiu=0 || saiu=$?
            codigo=$(printf '%s\n' "$bruto" | grep -m1 '^Verify return code:' || true)
            if printf '%s\n' "$codigo" | grep -q '(ok)'; then
              printf '%-52s ok\n' "$host" >> saida.txt
              continue
            fi
            ruins=$((ruins + 1))
            erro=$(printf '%s\n' "$bruto" | grep -m1 '^Verification error:' || true)
            queixa=$(printf '%s\n' "$bruto" \
                       | grep -m1 -E 'alert |Connection reset|no peer certificate' || true)
            enviados=$(printf '%s\n' "$bruto" | grep -c '^-----BEGIN CERTIFICATE-----' || true)
            emissores=$(printf '%s\n' "$bruto" | sed -n 's/^ *i://p' | paste -sd'|' - || true)
            veredito="${codigo:-$erro}"
            printf '%-52s %s\n' "$host" \
                   "${veredito:-sem veredito; openssl saiu $saiu}" >> saida.txt
            printf '%-52s   certificados enviados: %s\n' "" "$enviados" >> saida.txt
            printf '%-52s   emissores: %s\n' "" "${emissores:-nenhum}" >> saida.txt
            if [ -n "$queixa" ]; then
              printf '%-52s   %s\n' "" "$queixa" >> saida.txt
            fi
          done < hosts.txt
          printf '\n%s de %s hosts não validam com o bundle padrão.\n' \
                 "$ruins" "$total" >> saida.txt
          cat saida.txt

      - name: Escrever o resultado no resumo da execução
        # O log some no meio do ruído do runner; o resumo fica na página da
        # execução, que é onde quem apertou o botão vai olhar.
        if: always()
        shell: bash
        env:
          MODO: ${{ inputs.modo }}
        run: |
          {
            echo "## Dados abertos do Open Finance"
            echo
            echo "Modo \`$MODO\`, em $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo '```'
            head -c 60000 saida.txt 2>/dev/null || echo "sem saída: o passo anterior falhou antes de imprimir"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
