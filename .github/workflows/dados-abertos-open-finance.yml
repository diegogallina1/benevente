# Roda o coletor de dados abertos do Open Finance num runner, e não numa máquina.
#
# Existe porque o obstáculo nunca foi o código: era alcance de rede. Os dados
# abertos ficam no host de cada participante, todos no Brasil, e quem desenvolve
# nem sempre tem de onde chamá-los. O runner da Actions tem, e é gratuito para
# este uso.
#
# Não há credencial aqui, e isso não é descuido: a especificação de dados
# abertos não tem esquema de segurança, e o coletor não envia cabeçalho de
# autorização. Um teste prende isso. Por isso o job pede só leitura: ele não
# escreve no repositório, não publica nada e não tem segredo no ambiente.
name: Dados abertos do Open Finance

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "listar (quem publica), colher (busca os dados) ou diagnostico (TLS)"
        type: choice
        options: [listar, colher, diagnostico]
        default: listar
      limite:
        # Era "Vazio = todos", e vazio nunca quis dizer todos: o GitHub repõe o
        # default quando o valor chega em branco, entao pedir a colheita inteira
        # devolvia os mesmos cinco em silencio. Um valor explicito diz o que o
        # vazio nao consegue, e o default continua pequeno para um clique
        # distraido nao percorrer quarenta e seis hosts de terceiros.
        description: "Quantos participantes percorrer no modo colher. 0 = todos"
        type: string
        default: "5"
      participante:
        description: "Filtra por trecho do nome da organização ou da marca"
        type: string
        default: ""

# Só leitura. Este workflow observa; quem publica é outro.
permissions:
  contents: read

concurrency:
  group: benevente-dados-abertos
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    # Colher percorre centenas de hosts de terceiros, com pausa entre chamadas
    # de propósito. O teto é alto porque o modo colher sem limite é lento por
    # escolha, não por defeito.
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        # Presa ao SHA, nao a tag, como nos outros workflows: uma tag e um
        # ponteiro que o dono da action pode mover.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # Sem passo de instalação: o coletor é biblioteca padrão inteira. Se um
      # dia deixar de ser, a lista é requirements-ci.txt, nunca uma escrita aqui
      # — foi assim que o radar caiu oito execuções seguidas em setembro.

      # Os três chegam por env, nunca por ${{ }} dentro do run. A interpolação
      # é substituição textual antes de o shell ler a linha, então um nome de
      # participante com aspas e ponto-e-vírgula viraria comando. Por env eles
      # chegam como valor de variável, que o shell trata como dado. Um teste
      # deste repositório reprova a outra forma, e reprovou a primeira versão
      # deste arquivo.
      - name: Rodar o coletor
        if: inputs.modo != 'diagnostico'
        shell: bash
        env:
          MODO: ${{ inputs.modo }}
          LIMITE: ${{ inputs.limite }}
          PARTICIPANTE: ${{ inputs.participante }}
        run: |
          set -o pipefail
          argumentos=()
          if [ -n "$PARTICIPANTE" ]; then
            argumentos+=(--participante "$PARTICIPANTE")
          fi
          if [ "$MODO" = "listar" ]; then
            argumentos+=(--listar)
          elif [ -n "$LIMITE" ] && [ "$LIMITE" != "0" ]; then
            argumentos+=(--limite "$LIMITE")
          fi
          python tools/build_open_finance_investments.py "${argumentos[@]}" | tee saida.txt

      # Quarenta das sessenta e três falhas da primeira colheita inteira foram
      # certificado que o bundle padrão não valida. O número não decide nada
      # sozinho: se a raiz for a PKI do próprio Open Finance, acrescentá-la ao
      # truststore é o conserto; se for certificado avulso por instituição, não
      # há o que fazer do nosso lado. Este passo lê o emissor e responde qual é.
      #
      # Ele NÃO busca dado nenhum: abre a conexão, lê a cadeia e fecha. E o
      # coletor só imprime host que tem forma de host, porque esta lista vem do
      # diretório, que é preenchido por terceiros, e entra num laço de shell.
      - name: Diagnosticar o TLS dos hosts
        if: inputs.modo == 'diagnostico'
        shell: bash
        run: |
          python tools/build_open_finance_investments.py --hosts > hosts.txt
          : > saida.txt
          ruins=0
          total=0
          while read -r host; do
            [ -n "$host" ] || continue
            total=$((total + 1))
            cadeia=$(echo | timeout 20 openssl s_client -connect "$host:443" \
                       -servername "$host" -showcerts 2>/dev/null || true)
            codigo=$(printf '%s\n' "$cadeia" | grep -m1 '^Verify return code:' || true)
            if printf '%s\n' "$codigo" | grep -q '(ok)'; then
              printf '%-52s ok\n' "$host" >> saida.txt
            else
              ruins=$((ruins + 1))
              raiz=$(printf '%s\n' "$cadeia" | grep -E '^ +i:' | tail -1 || true)
              printf '%-52s %s\n' "$host" "${codigo:-sem resposta}" >> saida.txt
              printf '%-52s   raiz: %s\n' "" "${raiz:-desconhecida}" >> saida.txt
            fi
          done < hosts.txt
          printf '\n%s de %s hosts não validam com o bundle padrão.\n' \
                 "$ruins" "$total" >> saida.txt
          cat saida.txt

      - name: Escrever o resultado no resumo da execução
        # O log some no meio do ruído do runner; o resumo fica na página da
        # execução, que é onde quem apertou o botão vai olhar.
        if: always()
        shell: bash
        env:
          MODO: ${{ inputs.modo }}
        run: |
          {
            echo "## Dados abertos do Open Finance"
            echo
            echo "Modo \`$MODO\`, em $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo '```'
            head -c 60000 saida.txt 2>/dev/null || echo "sem saída: o passo anterior falhou antes de imprimir"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
