name: Consolidar radar de eventos

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0,12 * * *"
      timezone: "America/Sao_Paulo"

permissions:
  contents: write
  issues: write

concurrency:
  group: benevente-event-radar
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
    steps:
      - name: Baixar repositório
        # Presa ao SHA, nao a tag: uma tag e um ponteiro que o dono da action
        # pode mover, e estes jobs rodam com contents:write (e o do radar com
        # segredo no ambiente). Para atualizar, releia o SHA da tag desejada com
        # gh api repos/<acao>/git/ref/tags/<tag> --jq .object.sha
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar validador
        run: python -m pip install pytest

      - name: Consolidar fontes e validar contrato
        run: |
          python tools/update_event_radar.py
          python -m pytest tests/test_event_radar.py tests/test_seguranca_do_site.py -q

      - name: Abrir alerta de revisão para evento crítico
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          radar = json.loads(Path("web/event_radar.json").read_text(encoding="utf-8"))
          run = radar["consolidations"][0]
          critical = [item for item in radar["latest_items"] if item["state"] == "critico"]
          if not run["items_by_state"]["critico"] or not critical:
              raise SystemExit(0)
          lines = [
              "O radar encontrou evento(s) com materialidade crítica. Este aviso exige revisão humana e não altera a carteira.",
              "",
          ]
          for item in critical:
              score = item["classification"]["materiality"]
              lines.extend([f"- [{item['title']}]({item['url']}) — {score}/100", f"  - Fonte: {item['source']}"])
          lines.extend(["", f"Registro: `{radar['record_sha256']}`"])
          Path("radar-alert.md").write_text("\n".join(lines), encoding="utf-8")
          PY
          if [ -s radar-alert.md ]; then
            gh issue create --title "Radar Benevente: revisão de evento crítico" --body-file radar-alert.md --assignee @me
          fi

      - name: Publicar registro consolidado
        shell: bash
        run: |
          if git diff --quiet -- web/event_radar.json; then
            echo "Nenhum evento novo ou alteração de estado."
            exit 0
          fi
          git config user.name "diegogallina1"
          git config user.email "214411949+diegogallina1@users.noreply.github.com"
          git add web/event_radar.json
          git commit -m "Atualiza radar consolidado de eventos [skip ci]"
          # Rebase antes de empurrar: se o main andou desde o checkout, o push
          # direto é recusado com non-fast-forward e a consolidação se perde.
          # Resolve o caso comum, que é outro workflow ter publicado outro
          # arquivo no intervalo.
          #
          # Quando as duas execuções são do próprio radar, o rebase encontra
          # conflito, porque os dois lados são o mesmo arquivo gerado. Escolher
          # um dos lados seria inventar; refazer não é. O coletor acumula sobre
          # o documento anterior, então basta jogá-lo fora, pegar o que já foi
          # publicado e consolidar de novo em cima: o resultado contém os
          # eventos das duas execuções, que é o que se queria desde o começo.
          if ! git pull --rebase origin main; then
            echo "Conflito no arquivo gerado; refazendo a consolidação sobre o que já está publicado."
            git rebase --abort
            git reset --hard origin/main
            python tools/update_event_radar.py
            git add web/event_radar.json
            if git diff --cached --quiet; then
              echo "Depois de refazer, nada de novo a publicar."
              exit 0
            fi
            git commit -m "Atualiza radar consolidado de eventos [skip ci]"
          fi
          git push
