name: Atualizar acompanhamento da carteira

on:
  workflow_dispatch:
  schedule:
    - cron: "10 23 * * 1-5"
      timezone: "America/Sao_Paulo"

permissions:
  contents: write

concurrency:
  group: benevente-live-performance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        # Presa ao SHA, nao a tag: uma tag e um ponteiro que o dono da action
        # pode mover, e estes jobs rodam com contents:write (e o do radar com
        # segredo no ambiente). Para atualizar, releia o SHA da tag desejada com
        # gh api repos/<acao>/git/ref/tags/<tag> --jq .object.sha
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # numpy e pandas entram por portfolio_risk.py, de onde saem os
      # multiplicadores da camada de proteção. Esse arquivo é hasheado no
      # registro congelado da política, então não pode ser editado para ficar
      # leve — e copiar os multiplicadores para cá criaria uma segunda fonte
      # de um parâmetro declarado, que é pior do que instalar a dependência.
      #
      # A lista era escrita aqui à mão e ficou para trás: em 03/09/2026 os
      # testes passaram a alcançar fundamentals.py, que importa pydantic, e o
      # noturno quebrou três noites seguidas com ModuleNotFoundError enquanto
      # os outros workflows seguiam verdes — eles já liam requirements-ci.txt.
      # Uma lista só, com as versões presas, é o que impede a repetição.
      - name: Instalar dependências
        run: python -m pip install -r requirements-ci.txt

      - name: Atualizar séries e validar contrato
        run: |
          python tools/update_live_performance.py
          python tools/update_profile_books.py
          # A faixa de 2026 nao e recalculada aqui: ela foi congelada em janeiro
          # e uma faixa que se ajusta ao resultado nunca erra, entao nao mede
          # nada. Este passo so reescreve o outro lado da comparacao.
          python tools/build_forecast_2026_web.py
          # As mudancas da camada de protecao no ano, que a pagina lista ao
          # abrir cada carteira. Sai da mesma serie diaria.
          python tools/build_changes_2026_web.py
          # O documento do app embute o mesmo acompanhamento que o site publica,
          # e depende dos dois passos acima: e o payload que eles escrevem que
          # ele carrega para dentro. Ate 08/09/2026 este passo nao existia --
          # o app so mudava por revisao humana, o embutido envelhecia a cada
          # pregao, e o teste que compara os dois vivia deselecionado aqui
          # porque mediria o relogio. O envelhecimento entrou assim mesmo: o
          # commit deste workflow leva [skip ci], entao a CI de pull request,
          # que era quem barraria, nunca via o main andar. Em 08/09 o app
          # mostrava 165 pregoes e 2,73% enquanto o site publicava 170 e 5,70%.
          # Regerar aqui move os dois lados juntos e devolve sentido ao teste.
          python tools/build_mapa_prototype.py
          python tools/notify_queue.py
          # O mesmo verificador que a CI roda depois do merge. Aqui ele roda
          # antes do commit, que e onde ainda da tempo de nao publicar.
          python tools/verify_app_matches_site.py
          # monitor_pernas_e_faltas, escada_completa_em_2026 e forecast_2026
          # guardam o que a auditoria de setembro encontrou quebrado: o monitor
          # sem separar as pernas, listas de tres perfis escondendo o quarto
          # degrau, e a faixa de 2026 descrita como se tivesse sido desenhada em
          # janeiro. Nomeados, e nao "os tres ultimos": a lista cresceu.
          # O teste do app embutido volta para a lista, sem deselecao: com o
          # documento regerado acima, os dois lados param no mesmo dado e a
          # comparacao mede o que promete. test_intake_and_paths entra junto
          # porque e ele quem reprova quando o gerador nao rodou -- ele executa
          # build_mapa_prototype.py e exige que a pagina publicada nao mude.
          python -m pytest tests/test_live_performance.py tests/test_profile_books_2026.py tests/test_notify_queue.py \
            tests/test_monitor_pernas_e_faltas.py tests/test_escada_completa_em_2026.py tests/test_forecast_2026.py \
            tests/test_intake_and_paths.py tests/test_seguranca_do_site.py -q

      - name: Publicar somente quando houver novo dado
        shell: bash
        run: |
          # Os quatro ultimos sao a saida de build_mapa_prototype.py. Sem eles
          # aqui o passo acima regeraria o app e o commit deixaria a regeracao
          # para tras: o defeito original com uma etapa a mais para esconde-lo.
          tracked="web/live_performance.json web/live_profiles_2026.json web/forecast_2026.json web/mudancas_2026.json artifacts/notification_queue/queue.json docs/desenho_tela_mapa.html web/app.html web/plano.js web/plano.css"
          # Os perfis saem da politica, nao de uma lista escrita aqui. Escrita a
          # mao, esta ficou com tres quando a escada ganhou o quarto degrau: o
          # passo anterior gerava os quatro arquivos e este publicava tres, e o
          # ultraconservador congelava no site sem nenhum erro aparecer.
          for perfil in $(python -c "import sys; sys.path.insert(0, 'tools'); from politica import escada; print(' '.join(escada()))"); do
            tracked="$tracked web/live_performance_${perfil}.json web/current_decision_2026_${perfil}.json"
          done
          if git diff --quiet -- $tracked; then
            echo "Nenhuma nova observação de mercado."
            exit 0
          fi
          git config user.name "diegogallina1"
          git config user.email "214411949+diegogallina1@users.noreply.github.com"
          # -f porque o .gitignore descarta artifacts/ inteiro, e um diretorio
          # ignorado nao e percorrido nem para os arquivos ja rastreados dentro
          # dele: sem isso o git recusa o pathspec da fila de notificacoes e o
          # passo morre antes do commit. Nos caminhos de web/ o -f e inocuo.
          git add -f $tracked
          # O [skip ci] continua, e agora com o que o sustenta: o portao roda
          # neste job, antes do commit. Um passo acima que reprove derruba a
          # execucao e nada e publicado, o que protege mais do que uma CI
          # olhando depois que o push ja aconteceu.
          git commit -m "Atualiza acompanhamento corrente de 2026 [skip ci]"
          # Rebase antes de empurrar: se o main andou desde o checkout, o push
          # direto é recusado com non-fast-forward e a atualização se perde. O
          # radar publica duas vezes por dia no mesmo branch, então a corrida é
          # real. Conflito aqui não se resolve sozinho, porque os dois lados são
          # o mesmo arquivo gerado: o passo falha, e a execução seguinte
          # reconstrói do zero a partir do dado de mercado.
          git pull --rebase origin main
          git push
