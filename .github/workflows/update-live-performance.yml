name: Atualizar acompanhamento da carteira

on:
  workflow_dispatch:
  schedule:
    - cron: "10 23 * * 1-5"
      timezone: "America/Sao_Paulo"

permissions:
  contents: write

concurrency:
  group: benevente-live-performance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências mínimas
        run: python -m pip install pytest

      - name: Atualizar séries e validar contrato
        run: |
          python tools/update_live_performance.py
          PYTHONPATH=tools python tools/update_profile_books.py
          python tools/notify_queue.py
          python -m pytest tests/test_live_performance.py tests/test_profile_books_2026.py tests/test_notify_queue.py -q

      - name: Publicar somente quando houver novo dado
        shell: bash
        run: |
          tracked="web/live_performance.json web/live_profiles_2026.json artifacts/notification_queue/queue.json"
          for perfil in conservador equilibrado arrojado; do
            tracked="$tracked web/live_performance_${perfil}.json web/current_decision_2026_${perfil}.json"
          done
          if git diff --quiet -- $tracked; then
            echo "Nenhuma nova observação de mercado."
            exit 0
          fi
          git config user.name "diegogallina1"
          git config user.email "214411949+diegogallina1@users.noreply.github.com"
          git add $tracked
          git commit -m "Atualiza acompanhamento corrente de 2026 [skip ci]"
          git push
