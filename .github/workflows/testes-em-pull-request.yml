# Roda a suíte inteira antes de qualquer coisa entrar no main.
#
# Por que este arquivo existe: os outros dois workflows só disparam por horário
# ou por botão, então nada olhava para um pull request. Em 03/09/2026 três pull
# requests automáticos da Vercel foram mesclados e levaram para o site um
# segundo script de medição apontando para um domínio de terceiro, uma CSP
# reaberta com curinga e um passo de build que derrubou a publicação. O teste
# que proíbe medição de terceiro já existia e teria reprovado os três: ninguém
# o executou. Um teste que não roda no momento da decisão não protege nada.

name: Testes

on:
  pull_request:
    branches: [main]
  # O mesmo estrago pode chegar por push direto, inclusive dos meus.
  push:
    branches: [main]

# Só leitura: um pull request vindo de um fork não recebe permissão de escrita
# nem alcança segredo nenhum por aqui.
permissions:
  contents: read

concurrency:
  group: benevente-testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # O nome aparece como o check do pull request e é o texto que a proteção de
    # branch exige. Sem ele o check se chamaria "suite", que não diz nada a
    # quem abre o PR e nada a quem lê a regra de proteção meses depois.
    name: Suite de testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        # Presa ao SHA, nao a tag: uma tag e um ponteiro que o dono da action
        # pode mover, e estes jobs rodam com contents:write (e o do radar com
        # segredo no ambiente). Para atualizar, releia o SHA da tag desejada com
        # gh api repos/<acao>/git/ref/tags/<tag> --jq .object.sha
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Histórico inteiro: o verificador de hashes confere uma entrada que
          # aponta para o commit onde vive um documento substituído, e com o
          # checkout raso esse commit não existe na máquina.
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # A lista está em requirements-ci.txt com as versões presas, e o arquivo
      # explica quem puxa cada pacote. Sem eles o pytest nem coleta os testes:
      # os módulos de teste importam os do projeto no topo.
      - name: Instalar dependências
        run: python -m pip install -r requirements-ci.txt

      # Dezesseis testes não rodam num checkout limpo, e as três causas estão
      # separadas abaixo. Nenhuma delas é falha do teste: são coisas que só
      # existem na máquina de quem desenvolve. Quando a causa for resolvida, o
      # bloco correspondente sai daqui.
      #
      # 1. Leem arquivos sob artifacts/ que o .gitignore exclui. Parte de
      #    artifacts/ está versionada por ter entrado antes da regra; o resto
      #    não existe no clone.
      # 2. Registram política e param em "Recuse-se a registrar sem assinante":
      #    exigem um assinante humano no ambiente, que a CI não tem nem deve ter.
      # 3. Comparam SHA-256 de arquivos sob artifacts/ que o repositório entrega
      #    com LF e cujo hash publicado foi calculado sobre bytes com CRLF. O
      #    hash publicado está errado para quem clona: é defeito de verdade, e
      #    corrigi-lo mexe em registro publicado, então fica anotado aqui em vez
      #    de escondido atrás de um teste desligado sem explicação.
      - name: Rodar a suíte
        run: |
          python -m pytest -q \
            --deselect tests/test_build_paper_release.py::test_paper_release_reconciles_canonical_metrics \
            --deselect tests/test_build_paper_release.py::test_paper_release_writes_strict_json \
            --deselect tests/test_primary_reconciliation_audit.py::test_strategy_scope_reconciliation_refuses_false_completion \
            --deselect tests/test_release_manifest.py::test_release_manifest_contract \
            --deselect tests/test_tax_lot_accounting.py::test_artifact_matches_a_fresh_run \
            --deselect tests/test_tax_lot_accounting.py::test_published_book_satisfies_accounting_invariants \
            --deselect tests/test_profile_ladder.py::test_registration_hashes_every_declared_input \
            --deselect tests/test_profile_ladder.py::test_registration_records_no_performance_statistic \
            --deselect tests/test_intake_and_paths.py::test_o_app_e_o_site_dizem_a_mesma_coisa \
            --deselect tests/test_intake_and_paths.py::test_o_prototipo_publicado_nao_fica_para_tras_do_modulo \
            --deselect tests/test_publication_contract.py::test_ieee_supplement_is_anonymous_and_self_manifested \
            --deselect tests/test_profile_ladder_v2.py::test_registration_declares_the_currency_exposure_and_the_variant_count \
            --deselect tests/test_profile_ladder_v2.py::test_registration_hashes_inputs_and_its_own_code \
            --deselect tests/test_profile_ladder_v2.py::test_registration_records_no_performance_statistic \
            --deselect tests/test_publication_contract.py::test_site_data_contract_matches_canonical_sources \
            --deselect tests/test_strategy_decision_ledger.py::test_published_ledger_matches_the_builder

      # Este roda: ele não lê artifacts/ pelo disco, e sim os bytes que o Git
      # entrega, com `git show HEAD:<arquivo>`. É o que impede um hash publicado
      # de voltar a divergir do arquivo que a pessoa recebe ao clonar.
      - name: Conferir que todo hash publicado bate com o que o clone recebe
        run: python tools/verify_published_hashes.py

      # Os outros dois verificadores ficam de fora, e não por escolha: os dois leem
      # caminhos sob artifacts/, que o clone não recebe inteiro, e morrem em
      # FileNotFoundError antes de comparar qualquer coisa. Eles continuam
      # sendo rodados à mão antes de publicar. Enquanto artifacts/ não for
      # versionado ou reconstruível, é o máximo que a CI alcança — e isso está
      # dito aqui em vez de dar a impressão de que ela confere mais do que
      # confere.
